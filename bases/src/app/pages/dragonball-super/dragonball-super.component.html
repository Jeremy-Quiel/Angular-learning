<h1>Dragon Ball</h1>
<hr>

<section class="row">
  <div class="col-12 col-sm-6">
    <dragonball-form-character
    (stronger)="set_stronger($event)"/>
  </div>


  <div class="col-12 col-sm-6">
    <!-- la variable characters de dragonball-character-list es igual a character() de dragonball-super.component.ts -->
    <dragonball-character-list
    title_name = "Character list"
    [characters]="characters()"/>
  </div>
</section>

<h2>Stronger</h2>
<h3>{{ stronger().id }} - {{ stronger().name }} - {{ stronger().power }}</h3>
