<h1>{{ name() }}</h1>

<dl>
  <td>Name:</td>
  <dd>{{ name() }}</dd>

  <td>Age:</td>
  <dd>{{ age() }}</dd>

  <td>Method:</td>
  <dd>{{ getHeroDescription() }}</dd>

  <td>Capitalize:</td>
  <!-- <dd>{{ capitalize() }}</dd> -->
   <dd>{{ name() | uppercase }}</dd> <!-- Usar un PIPE -->
</dl>

<button (click)="changeHero()" class="btn btn-primary mx-2">
  Cambiar nombre
</button>

<button class="btn btn-primary" (click)="changeAge(60)">Change age</button>

<button (click)="resetForm('Iron-Man', 45)" class="btn btn-primary mx-2">Reset</button>
